paths:
  /data/v1/audit/auditEvents:
    get:
      tags:
      - Audit Logging
      summary: GET /data/v1/audit/auditEvents
      operationId: get_data_v1_audit_auditEvents
      description: Retrieves Audit Trail or security events for the current account
        and child accounts. These endpoints support compliance, forensics, and API
        activity review.
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security:
      - bearerAuth: []
      x-sfmc-permission-ids:
      - '1707'
      x-sfmc-user-permission-paths:
      - Audit Logging > API Access
      x-sfmc-installed-package-scopes:
      - tracking_events_read
      x-original-marketing-cloud-paths:
      - /data/v1/audit/auditEvents
