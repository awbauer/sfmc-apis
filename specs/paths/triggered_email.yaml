paths:
  /messaging/v1/messageDefintionSend/{key}/send:
    post:
      tags:
      - Triggered Email
      summary: POST /messaging/v1/messageDefintionSend/{key}/send
      operationId: post_messaging_v1_messageDefintionSend_key_send
      description: Sends a classic triggered email using a triggered send definition
        managed in Email Studio. Salesforce documents this route as the older triggered-send
        model and recommends the transactional messaging API for new builds.
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Path parameter `key`.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security:
      - bearerAuth: []
      x-sfmc-permission-ids:
      - '9'
      x-sfmc-user-permission-paths:
      - Email > Content > Email > Send
      x-sfmc-installed-package-scopes:
      - email_send
      x-original-marketing-cloud-paths:
      - /messaging/v1/messageDefintionSend/{key}/send
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericRequestBody
