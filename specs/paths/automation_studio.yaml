paths:
  /automation/v1/automations:
    get:
      tags:
      - Automation Studio
      summary: GET /automation/v1/automations
      operationId: get_automation_v1_automations
      description: Lists automations in the current business unit. Use query parameters
        to page, order, and filter by name or status. This is the modern automation
        surface; the matching legacy beta routes are retained for compatibility with
        existing integrations.
      parameters:
      - $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/parameters/page
      - $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/parameters/pageSize
      - name: $orderBy
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated ordering expression, for example `name asc`.
      - name: $filter
        in: query
        required: false
        schema:
          type: string
        description: Filter expression applied server-side.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/AutomationListResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security:
      - bearerAuth: []
      x-sfmc-permission-ids: []
      x-sfmc-user-permission-paths:
      - Automation Studio > Interactions > Automations > View
      x-sfmc-installed-package-scopes:
      - automations_read
      x-original-marketing-cloud-paths:
      - /automation/v1/automations
    post:
      tags:
      - Automation Studio
      summary: POST /automation/v1/automations
      operationId: post_automation_v1_automations
      description: Creates a new automation in the current business unit. The payload
        references the step activities, schedules, and notifications that make up the
        automation; shape details are documented narratively by Salesforce and evolve
        across releases.
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security:
      - bearerAuth: []
      x-sfmc-permission-ids: []
      x-sfmc-user-permission-paths:
      - Automation Studio > Interactions > Automations > Create
      x-sfmc-installed-package-scopes:
      - automations_write
      x-original-marketing-cloud-paths:
      - /automation/v1/automations
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericRequestBody
  /automation/v1/automations/{id}:
    get:
      tags:
      - Automation Studio
      summary: GET /automation/v1/automations/{id}
      operationId: get_automation_v1_automations_id
      description: Retrieves a single automation by identifier. Returns the full
        definition including activities, schedule, and status metadata.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Path parameter `id` (ObjectID of the automation).
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security:
      - bearerAuth: []
      x-sfmc-permission-ids: []
      x-sfmc-user-permission-paths:
      - Automation Studio > Interactions > Automations > View
      x-sfmc-installed-package-scopes:
      - automations_read
      x-original-marketing-cloud-paths:
      - /automation/v1/automations/{id}
    patch:
      tags:
      - Automation Studio
      summary: PATCH /automation/v1/automations/{id}
      operationId: patch_automation_v1_automations_id
      description: Updates an automation by identifier. Use for in-place configuration
        changes; replace the full definition sparingly because partial updates are the
        documented path.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Path parameter `id` (ObjectID of the automation).
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security:
      - bearerAuth: []
      x-sfmc-permission-ids: []
      x-sfmc-user-permission-paths:
      - Automation Studio > Interactions > Automations > Edit
      x-sfmc-installed-package-scopes:
      - automations_write
      x-original-marketing-cloud-paths:
      - /automation/v1/automations/{id}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericRequestBody
    delete:
      tags:
      - Automation Studio
      summary: DELETE /automation/v1/automations/{id}
      operationId: delete_automation_v1_automations_id
      description: Deletes an automation by identifier. Deletion is immediate and
        irreversible; stop the automation first if it may currently be running.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Path parameter `id` (ObjectID of the automation).
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security:
      - bearerAuth: []
      x-sfmc-permission-ids: []
      x-sfmc-user-permission-paths:
      - Automation Studio > Interactions > Automations > Delete
      x-sfmc-installed-package-scopes:
      - automations_write
      x-original-marketing-cloud-paths:
      - /automation/v1/automations/{id}
  /automation/v1/automations/{id}/actions/{action}:
    post:
      tags:
      - Automation Studio
      summary: POST /automation/v1/automations/{id}/actions/{action}
      operationId: post_automation_v1_automations_id_actions_action
      description: Performs a lifecycle action on an automation. Valid actions are
        `start`, `stop`, and `pause`; the return payload echoes a status identifier
        that can be polled separately.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Path parameter `id` (ObjectID of the automation).
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - start
          - stop
          - pause
        description: Lifecycle action to perform.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/AutomationActionResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security:
      - bearerAuth: []
      x-sfmc-permission-ids: []
      x-sfmc-user-permission-paths:
      - Automation Studio > Interactions > Automations > Execute
      x-sfmc-installed-package-scopes:
      - automations_execute
      x-original-marketing-cloud-paths:
      - /automation/v1/automations/{id}/actions/{action}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/AutomationActionRequest
  /legacy/v1/beta/automations/automation/definition/:
