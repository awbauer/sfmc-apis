paths:
  /v2/discovery:
    get:
      tags:
      - Auth
      summary: GET /v2/discovery
      operationId: get_v2_discovery
      x-migration-direction: control-plane
      servers:
      - url: https://{subdomain}.auth.marketingcloudapis.com
        description: Tenant auth base URL for OAuth 2.0 and legacy token routes.
        variables:
          subdomain:
            default: YOUR_SUBDOMAIN
      description: Returns discovery metadata for the tenant authorization environment.
        This is commonly used to find the correct auth host and related endpoints
        before starting an OAuth flow.
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/AuthDiscoveryResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security: []
      x-sfmc-permission-ids:
      - No permission required
      x-sfmc-user-permission-paths:
      - None
      x-sfmc-installed-package-scopes:
      - None
      x-original-marketing-cloud-paths:
      - /v2/discovery
  /v2/userinfo:
    get:
      tags:
      - Auth
      summary: GET /v2/userinfo
      operationId: get_v2_userinfo
      x-migration-direction: control-plane
      servers:
      - url: https://{subdomain}.auth.marketingcloudapis.com
        description: Tenant auth base URL for OAuth 2.0 and legacy token routes.
        variables:
          subdomain:
            default: YOUR_SUBDOMAIN
      description: Returns details about the authenticated user and the scopes granted
        to the current token. Salesforce recommends calling this after the authorization-code
        flow when you need to compare package scopes with the end user's own permissions.
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/AuthUserInfoResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security: []
      x-sfmc-permission-ids:
      - No permission required
      x-sfmc-user-permission-paths:
      - None
      x-sfmc-installed-package-scopes:
      - None
      x-original-marketing-cloud-paths:
      - /v2/userinfo
  /v2/authorize:
    get:
      tags:
      - Auth
      summary: GET /v2/authorize
      operationId: get_v2_authorize
      x-migration-direction: control-plane
      servers:
      - url: https://{subdomain}.auth.marketingcloudapis.com
        description: Tenant auth base URL for OAuth 2.0 and legacy token routes.
        variables:
          subdomain:
            default: YOUR_SUBDOMAIN
      description: Starts the OAuth 2.0 authorization-code flow for web and public
        app integrations. The user authenticates on the Marketing Cloud authorization
        host and is redirected to the configured redirect_uri with a code parameter.
        Use state to protect against CSRF and request only scopes your installed package
        actually has.
      parameters:
      - name: response_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - code
        description: OAuth response type. Use `code` for the authorization-code flow.
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Installed package client ID.
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          format: uri
        description: Redirect URI configured for the installed package.
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Optional opaque CSRF token echoed back on redirect.
      - name: scope
        in: query
        required: false
        schema:
          type: string
        description: Optional space-delimited requested scopes.
      responses:
        '302':
          description: Authorization redirect. The Location header contains the
            redirect URI with authorization code or error details.
          headers:
            Location:
              description: Redirect target with OAuth result parameters.
              schema:
                type: string
                format: uri
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security: []
      x-sfmc-permission-ids:
      - No permission required
      x-sfmc-user-permission-paths:
      - None
      x-sfmc-installed-package-scopes:
      - None
      x-original-marketing-cloud-paths:
      - /v2/authorize
  /v2/token:
    post:
      tags:
      - Auth
      summary: POST /v2/token
      operationId: post_v2_token
      x-migration-direction: control-plane
      servers:
      - url: https://{subdomain}.auth.marketingcloudapis.com
        description: Tenant auth base URL for OAuth 2.0 and legacy token routes.
        variables:
          subdomain:
            default: YOUR_SUBDOMAIN
      description: Issues OAuth 2.0 access tokens for server-to-server integrations
        with the client-credentials grant, or access and refresh tokens for web/public
        apps with authorization_code and refresh_token grants. The docs note a 20
        minute token lifetime, an expires_in value that is intentionally shorter than
        the actual lifetime, optional scope downscoping, and optional account_id to
        switch business-unit context.
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/AuthTokenResponse
              examples:
                client_credentials:
                  summary: Server-to-server token response
                  value:
                    access_token: eyJhbGciOi...
                    token_type: Bearer
                    expires_in: 1080
                    scope: email_send email_read
                    rest_instance_url: https://mct1234k8w5xyz.rest.marketingcloudapis.com/
                    soap_instance_url: https://mct1234k8w5xyz.soap.marketingcloudapis.com/
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security: []
      x-sfmc-permission-ids:
      - No permission required
      x-sfmc-user-permission-paths:
      - None
      x-sfmc-installed-package-scopes:
      - None
      x-original-marketing-cloud-paths:
      - /v2/token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/AuthTokenRequest
            examples:
              client_credentials:
                summary: Standard installed package server-to-server token exchange
                value:
                  grant_type: client_credentials
                  client_id: 7f7f7f7f-aaaa-bbbb-cccc-123456789abc
                  client_secret: your-client-secret
                  account_id: 12345678
  /v1/requestToken:
    post:
      tags:
      - Auth
      summary: POST /v1/requestToken
      operationId: post_v1_requestToken
      x-migration-direction: control-plane
      servers:
      - url: https://{subdomain}.auth.marketingcloudapis.com
        description: Tenant auth base URL for OAuth 2.0 and legacy token routes.
        variables:
          subdomain:
            default: YOUR_SUBDOMAIN
      description: Legacy authentication route for legacy packages. Use only when
        you are integrating with older package models that do not support OAuth 2.0
        installed-package integrations.
      deprecated: true
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/AuthTokenResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security: []
      x-sfmc-permission-ids:
      - No permission required
      x-sfmc-user-permission-paths:
      - None
      x-sfmc-installed-package-scopes:
      - None
      x-original-marketing-cloud-paths:
      - /v1/requestToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/LegacyRequestTokenRequest
            examples:
              legacy_request_token:
                summary: Legacy package token request
                value:
                  clientId: legacy-client-id
                  clientSecret: legacy-client-secret
