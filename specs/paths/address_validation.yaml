paths:
  /address/v1/validateEmail:
    post:
      tags:
      - Address Validation
      summary: POST /address/v1/validateEmail
      operationId: post_address_v1_validateEmail
      description: Validates an email address before use in capture or send flows.
        Use this route as a hygiene check before persisting or sending, especially
        when upstream systems do not already enforce syntax and domain quality.
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericResponse
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security:
      - bearerAuth: []
      x-sfmc-permission-ids:
      - '5'
      x-sfmc-user-permission-paths:
      - Email > Content > Email > View
      x-sfmc-installed-package-scopes:
      - email_read
      x-original-marketing-cloud-paths:
      - /address/v1/validateEmail
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../sfmc_marketing_cloud_openapi.yaml#/components/schemas/GenericRequestBody
