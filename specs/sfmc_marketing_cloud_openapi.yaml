components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token obtained from Marketing Cloud OAuth endpoints.
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://YOUR_SUBDOMAIN.auth.marketingcloudapis.com/v2/token
          scopes:
            email_read: Read email resources
            email_send: Send email
            email_write: Create/update/delete email resources
            sms_read: Read SMS resources
            sms_send: Send SMS
            sms_write: Create/update/delete SMS resources
            push_read: Read push resources
            push_send: Send push messages
            push_write: Write push resources
            journeys_read: Read Journey Builder resources
            list_and_subscribers_read: Read contact and subscriber resources
            list_and_subscribers_write: Write contact and subscriber resources
            documents_and_images_read: Read content assets and folders
            documents_and_images_write: Write content assets and folders
            saved_content_read: Read saved content and related setup
            saved_content_write: Write saved content
            campaign_read: Read campaigns
            campaign_write: Write campaigns
            tracking_events_read: Read tracking and audit events
            audiences_read: Read audiences
            approvals_read: Read approvals
            approvals_write: Write approvals
            tags_read: Read tags
            tags_write: Write tag associations
            tags_create: Create tags
            tags_edit: Edit tags
            tags_delete: Delete tags
            event_notification_callback_create: Create ENS callbacks
            event_notification_callback_read: Read ENS callbacks
            event_notification_callback_update: Update ENS callbacks
            event_notification_callback_delete: Delete ENS callbacks
            event_notification_subscription_create: Create ENS subscriptions
            event_notification_subscription_read: Read ENS subscriptions
            event_notification_subscription_update: Update ENS subscriptions
            event_notification_subscription_delete: Delete ENS subscriptions
            file_location_create: Create file locations
            file_location_view: View file locations
            file_location_delete: Delete file locations
            contacts_read: Read contact preferences and profile data
            contacts_write: Create and update contact preferences and profile data
            data_extensions_read: Read data extension async job and row resources
            data_extensions_write: Write data extension async job and row resources
            automations_read: Read Automation Studio automations
            automations_write: Create, update, and delete Automation Studio automations
            automations_execute: Start, stop, and pause Automation Studio automations
            ott_channels_read: Read OTT (WhatsApp, Facebook Messenger, LINE) channel
              resources
            ott_channels_send: Send OTT messages across registered channels
            ott_channels_write: Create, update, and delete OTT channel resources
  parameters:
    page:
      name: $page
      in: query
      required: false
      schema:
        type: integer
      description: One-based page index.
    pageSize:
      name: $pageSize
      in: query
      required: false
      schema:
        type: integer
      description: Page size.
  schemas:
    JourneyPublishStatusResponse:
      type: object
      properties:
        statusId:
          type: string
        status:
          type: string
          enum:
          - PublishInProcess
          - PublishCompleted
          - Error
        message:
          type: string
        definitionId:
          type: string
        versionNumber:
          type: integer
        publishedDate:
          type: string
          format: date-time
      additionalProperties: true
    JourneyAuditResponse:
      type: object
      properties:
        id:
          type: string
        definitionId:
          type: string
        definitionKey:
          type: string
        versionNumber:
          type: integer
        action:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              createdDate:
                type: string
                format: date-time
              user:
                type: string
              details:
                type: object
                additionalProperties: true
      additionalProperties: true
    JourneyContactExitRequest:
      type: object
      required:
      - ContactKey
      - DefinitionKey
      properties:
        ContactKey:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          description: Single contact key or array of contact keys to remove.
        DefinitionKey:
          type: string
          description: Journey definition key shared across journey versions.
        Versions:
          type: array
          items:
            type: integer
      additionalProperties: false
    JourneyContactExitResponse:
      type: object
      properties:
        operationId:
          type: string
        definitionKey:
          type: string
        contactKey:
          oneOf:
          - type: string
