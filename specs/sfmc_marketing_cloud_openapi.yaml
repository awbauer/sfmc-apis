openapi: 3.0.3
info:
  title: Salesforce Marketing Cloud Engagement Migration APIs
  version: 0.19.0
  description: >
    Machine-readable OpenAPI contract for migration agents to move data, assets,
    and configuration into and out of Salesforce Marketing Cloud Engagement.

  
    Each operation includes vendor extensions that guide execution:
      - x-migration-direction defines import vs export
      - x-bulk-capable flags bulk support
      - x-polling-endpoint-of maps async job relationships
  
    These annotations enable agents to plan idempotent, reliable migration flows.
  
    Coverage spans the documented SFMC REST surface, including:
      auth, discovery, platform utilities, transactional messaging (email, SMS,
      OTT/WhatsApp), triggered messaging, MobileConnect, MobilePush,
      GroupConnect (Facebook Messenger, LINE), Contacts, Journey Builder,
      Automation Studio, Content Builder (assets, categories, asset types),
      Campaigns, Approvals, Tags, Event Notification Service, Data Extensions,
      Domain Verification, File Locations, Address Validation, and Audit Logging.
  
    Each operation also retains permission metadata via vendor extensions,
    including permission IDs, user-permission paths, and installed-package scopes.
  
    This is not an official Salesforce export. Salesforce does not publish a
    single complete machine-readable contract, so some operations use broader
    schemas where the source documentation is descriptive, polymorphic, or
    fragmented.
x-migration-directions:
  description: Allowed values for the per-operation x-migration-direction extension
    used by migration agents consuming this spec.
  enum:
  - import
  - export
  - both
  - control-plane
servers:
- url: https://{subdomain}.rest.marketingcloudapis.com
  description: Tenant REST API base URL returned by auth and discovery endpoints.
  variables:
    subdomain:
      default: YOUR_SUBDOMAIN
security:
- bearerAuth: []
tags:
- name: Auth
  description: OAuth 2.0 and legacy token endpoints for Marketing Cloud Engagement
    installed packages.
- name: Discovery
  description: Endpoints that disclose tenant endpoint topology or the caller context.
- name: Address Validation
  description: Validation endpoints for email addresses before send or capture.
- name: Domain Verification
  description: Endpoints to list, create, update, delete, bulk load, and push verified
    sending domains.
- name: Data Extensions
  description: Async and synchronous row operations for data extensions and data events.
- name: Triggered Email
  description: Classic triggered send endpoint managed from Email Studio.
- name: Transactional Email
  description: Modern transactional messaging endpoints for email definitions and
    messages.
- name: Transactional SMS
  description: Modern transactional messaging endpoints for SMS definitions, queue
    metrics, and sends.
- name: Transactional OTT
  description: Modern transactional messaging endpoints for OTT (WhatsApp) definitions,
    queue metrics, and sends.
- name: File Locations
  description: Platform endpoints for external file location keys used by imports
    and file-based integrations.
- name: Campaigns
  description: Interactive Marketing Hub campaign resources and campaign-to-asset
    associations.
- name: MobileConnect SMS
  description: Legacy MobileConnect operational APIs for imports, sends, opt-in, subscriptions,
    keyword management, and delivery retrieval.
- name: GroupConnect Chat
  description: GroupConnect chat messaging registration and sends for Facebook Messenger
    and LINE channels.
- name: Contacts
  description: Contact Builder and contact model endpoints for schema, search, preferences,
    delete, restrict, and audience operations.
- name: Journey Builder
  description: Journey definitions, event definitions, event injection, publication,
    stop, pause, resume, and membership utilities.
- name: Automation Studio
  description: Automation Studio automations and legacy beta automation definitions
    plus start, stop, and pause action controls.
- name: Mobile Push
  description: MobilePush application, location, message, and delivery endpoints.
- name: Content Builder
  description: Content Builder assets and folder resources.
- name: Asset Types
  description: Content Builder asset type taxonomy listing the supported asset kinds.
- name: Approvals
  description: Approval item and approval settings endpoints.
- name: Tags
  description: Tag creation, editing, retrieval, association, and deletion.
- name: Event Notification Service
  description: Callback and subscription management for ENS webhooks.
- name: Audit Logging
  description: Audit Trail and security event retrieval.
