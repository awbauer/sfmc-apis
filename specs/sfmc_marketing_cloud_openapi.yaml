openapi: 3.0.3
info:
  title: Salesforce Marketing Cloud Engagement REST APIs
  version: 0.9.0
  description: Working OpenAPI/Swagger-style specification generated from the SFMC permission/scope matrix you supplied and normalized against Salesforce Marketing Cloud Engagement documentation. It covers the endpoint families present in that matrix, adds narrative descriptions for each operation, and preserves original permission IDs, user-permission paths, and installed-package scopes as vendor extensions. Because Salesforce does not publish a single complete machine-readable contract for every route in this matrix, some operations still use broader schemas where the official reference is descriptive, polymorphic, or fragmented across pages.
servers:
- url: https://{subdomain}.rest.marketingcloudapis.com
  description: Tenant REST API base URL returned by auth and discovery endpoints.
  variables:
    subdomain:
      default: YOUR_SUBDOMAIN
- url: https://{subdomain}.auth.marketingcloudapis.com
  description: Tenant auth base URL for OAuth 2.0 and legacy token routes.
  variables:
    subdomain:
      default: YOUR_SUBDOMAIN
tags:
- name: Auth
  description: OAuth 2.0 and legacy token endpoints for Marketing Cloud Engagement installed packages.
- name: Discovery
  description: Endpoints that disclose tenant endpoint topology or the caller context.
- name: Address Validation
  description: Validation endpoints for email addresses before send or capture.
- name: Domain Verification
  description: Endpoints to list, create, update, delete, bulk load, and push verified sending domains.
- name: Data Extensions
  description: Async and synchronous row operations for data extensions and data events.
- name: Triggered Email
  description: Classic triggered send endpoint managed from Email Studio.
- name: Transactional Email
  description: Modern transactional messaging endpoints for email definitions and messages.
- name: Transactional SMS
  description: Modern transactional messaging endpoints for SMS definitions, queue metrics, and sends.
- name: File Locations
  description: Platform endpoints for external file location keys used by imports and file-based integrations.
- name: Campaigns
  description: Interactive Marketing Hub campaign resources and campaign-to-asset associations.
- name: MobileConnect SMS
  description: Legacy MobileConnect operational APIs for imports, sends, opt-in, subscriptions, keyword management, and delivery retrieval.
- name: Contacts
  description: Contact Builder and contact model endpoints for schema, search, preferences, delete, restrict, and audience operations.
- name: Journey Builder
  description: Journey definitions, event definitions, event injection, publication, stop, pause, resume, and membership utilities.
- name: Mobile Push
  description: MobilePush application, location, message, and delivery endpoints.
- name: Content Builder
  description: Content Builder assets and folder resources.
- name: Approvals
  description: Approval item and approval settings endpoints.
- name: Tags
  description: Tag creation, editing, retrieval, association, and deletion.
- name: Event Notification Service
  description: Callback and subscription management for ENS webhooks.
- name: Audit Logging
  description: Audit Trail and security event retrieval.
paths:
  /address/v1/validateEmail:
    post:
      tags:
      - Address Validation
      summary: POST /address/v1/validateEmail
      operationId: post_address_v1_validateEmail
      description: Validates an email address before use in capture or send flows. Use this route as a hygiene check before persisting or sending, especially when upstream systems do not already enforce syntax and domain quality.
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '429':
          description: Too many requests or throttled.
        '500':
          description: Server error.
      security:
      - bearerAuth: []
      x-sfmc-permission-ids:
      - '5'
      x-sfmc-user-permission-paths:
      - Email > Content > Email > View
      x-sfmc-installed-package-scopes:
      - email_read
      x-original-marketing-cloud-paths:
      - /address/v1/validateEmail
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequestBody'
