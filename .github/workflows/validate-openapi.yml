name: Validate OpenAPI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Validate OpenAPI + Spectral + scope sync + migrations
        run: npm run validate
      - name: MCP server self-check
        run: npm run mcp -- --self-check
