name: Build Postman collection

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate SOAP collection and environment
        run: npm run postman:soap
      - name: Check generated JSON parses
        run: |
          for f in postman/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))" && echo "ok: $f"
          done
      - name: Upload Postman artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfmc-soap-postman
          path: postman/*.json
          if-no-files-found: error
